repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.1
    hooks:
      - id: uv-lock
      - id: uv-export
        # Omit the `-e .` self-reference; pip rejects it alongside hashed pins.
        args: [ --frozen, --no-emit-project, --output-file=requirements.txt ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly (type checking)
        entry: uv run pyrefly check
        language: system
        types_or: [ python, pyi ]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [ python ]
        pass_filenames: false
