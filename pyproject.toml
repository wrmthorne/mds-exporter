[project]
name = "mds-exporter"
version = "0.3.2"
description = "A CLI tool for bulk downloading from museum data service API with rich progress tracking."
readme = "README.md"
authors = [
    { name = "William Thorne", email = "wthorne1@sheffield.ac.uk" }
]
license = { text = "MIT" }
keywords = ["museum", "data", "cli", "bulk-download", "api"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "httpx>=0.28.1",
    "requests>=2.32.4",
    "rich>=14.1.0",
    "zstandard>=0.23.0",
]

[project.urls]
"Homepage" = "https://github.com/wrmthorne/mds-exporter"
"Bug Reports" = "https://github.com/wrmthorne/mds-exporter/issues"
"Source" = "https://github.com/wrmthorne/mds-exporter"

[project.scripts]
mds = "mds_exporter:main"
# Alias matching the distribution name, so `uvx mds-exporter` works without `--from`.
mds-exporter = "mds_exporter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 119

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.12"
